<app-base-table 
  [apiService]="apiService"
  [columns]="columns"
  [title]="'Biểu mẫu: Kế hoạch vật tư, phụ tùng thay thế (RD.QT15.BM05)'"
  [showAddButton]="false"
  [showEditButton]="false"
  [showViewButton]="false"
  [showDeleteButton]="false"
  [actionTemplate]="customActions">
  <ng-template appColumnTemplate="status" let-rowData>
    <p-tag [value]="statusToString(rowData)" [severity]="statusToSeverity(rowData)"></p-tag>
  </ng-template>
  <ng-template appColumnTemplate="createdAt" let-rowData>
    {{ rowData | date: 'dd/MM/yyyy' }}
  </ng-template>
</app-base-table>

<ng-template #customActions let-row>
  <p-button icon="pi pi-file-pdf" title="Xem & In kế hoạch vật tư"
    styleClass="p-button-sm p-button-rounded p-button-info m-1" (onClick)="viewSupplyReport(row)"></p-button>
  <p-button icon="pi pi-external-link" title="Đến màn hình quản lý gốc"
    styleClass="p-button-sm p-button-rounded p-button-secondary m-1" (onClick)="goToOriginal(row)"></p-button>
</ng-template>
