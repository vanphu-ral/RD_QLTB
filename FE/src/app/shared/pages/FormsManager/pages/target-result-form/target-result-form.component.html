<app-base-table 
  [apiService]="apiService"
  [columns]="columns"
  [title]="'Biểu mẫu: Báo cáo kết quả thực hiện mục tiêu QLTB (RĐ.QT15.BM02b)'"
  [showAddButton]="false"
  [showEditButton]="false"
  [showViewButton]="false"
  [showDeleteButton]="false"
  [actionTemplate]="customActions">
  <ng-template appColumnTemplate="planTargetDevice.numberOfIssuances" let-rowData>
    <div class="text-center font-semibold">{{ rowData || 1 }}</div>
  </ng-template>
  <ng-template appColumnTemplate="executionTime" let-rowData>
    <div class="text-center">{{ rowData | date: 'MM/yyyy' }}</div>
  </ng-template>
  <ng-template appColumnTemplate="updatedAt" let-rowData>
    <div class="text-center">{{ rowData | date: 'dd/MM/yyyy' }}</div>
  </ng-template>
  <ng-template appColumnTemplate="status" let-rowData>
    <p-tag [value]="statusToString(rowData)" [severity]="statusToSeverity(rowData)"></p-tag>
  </ng-template>
</app-base-table>

<ng-template #customActions let-row>
  <p-button icon="pi pi-file-edit" title="Xem biểu mẫu kết quả tháng (BM02b)"
    styleClass="p-button-sm p-button-rounded p-button-success m-1" (onClick)="viewMonthReport(row)"></p-button>
  <p-button icon="pi pi-external-link" title="Xem kế hoạch mục tiêu năm (BM02a)"
    styleClass="p-button-sm p-button-rounded p-button-secondary m-1" (onClick)="viewPlanReport(row)"></p-button>
</ng-template>
