<!-- device-list.component.html -->
<app-base-table 
  [apiService]="apiService"
  [columns]="columns"
  [title]="'Danh sách thiết bị'"
  [showAddButton]="true"
  [actionTemplate]="customActions"
  [isLazy]="true">
  <ng-template appColumnTemplate="status" let-rowData>
    <p-tag [value]="statusToString(rowData)" [severity]="statusToSeverity(rowData)"></p-tag>
  </ng-template>
  <ng-template appColumnTemplate="createdAt" let-rowData>
    {{ rowData | date: 'dd/MM/yyyy' }}
  </ng-template>
  <ng-template appColumnTemplate="updatedAt" let-rowData>
    {{ rowData | date: 'dd/MM/yyyy' }}
  </ng-template>
</app-base-table>
<ng-template #customActions let-row>
  <p-button icon="pi pi-history" styleClass="p-button-sm p-button-rounded p-button-warn m-1" (onClick)="historyMoveDialog(row)"></p-button>
  <p-button icon="pi pi-arrows-h" styleClass="p-button-sm p-button-rounded p-button-success m-1" (onClick)="moveDeviceDialog(row)"></p-button>
</ng-template>
