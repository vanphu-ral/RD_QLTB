<div class="p-1">
  <div class="d-flex justify-content-end mt-2 mb-4">
    <p-button label="Thêm thông số" icon="pi pi-plus" (onClick)="addNewRow()"></p-button>
  </div>

  <div class="table-responsive">
    <p-table [value]="listParameterUse" responsiveLayout="scroll">
      <ng-template pTemplate="header">
        <tr>
          <th>Thông số</th>
          <th>Min</th>
          <th>Max</th>
          <th>Giá trị</th>
          <th>Đơn vị tính</th>
          <th>Mô tả</th>
          <th>Thao tác</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-row let-i="rowIndex">
        <tr>
          <td>
            <p-select [(ngModel)]="row.parameter"
                      [options]="listParameters"
                      optionLabel="name"
                      dataKey="id"
                      [fluid]="true"
                      [filter]="true"
                      [showClear]="true"
                      appendTo="body"
                      name="parameter-{{i}}">
            </p-select>
          </td>
          <td>
            <p-inputnumber [(ngModel)]="row.min" name="min-{{i}}" mode="decimal"></p-inputnumber>
          </td>
          <td>
            <p-inputnumber [(ngModel)]="row.max" name="max-{{i}}" mode="decimal"></p-inputnumber>
          </td>
          <td>
            <p-inputnumber [(ngModel)]="row.value" name="value-{{i}}" mode="decimal"></p-inputnumber>
          </td>
          <td>
            <input type="text" pInputText [(ngModel)]="row.unit" name="unit-{{i}}" />
          </td>
          <td>
            <input type="text" pInputText [(ngModel)]="row.description" name="description-{{i}}" />
          </td>
          <td class="text-center">
            <p-button icon="pi pi-trash" severity="danger" (onClick)="deleteRow(i)"></p-button>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7" class="text-center">Chưa có thông số nào được thêm</td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <div class="d-flex justify-content-end gap-2 mt-4">
    <p-button label="Lưu" severity="success" (onClick)="submit()"></p-button>
    <p-button label="Đóng" (onClick)="close()"></p-button>
  </div>
</div>
