<div class="p-1">
    <div class="d-flex justify-content-end mt-2 mb-4">
        <p-button label="Thêm vật tư" icon="pi pi-plus" (onClick)="addNewRow()"></p-button>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>vật tư</th>
                    <th>mã serial</th>
                    <th>số lượng sử dụng</th>
                    <th>mô tả</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let row of listMaterial; let i = index">
                    <td>
                        <p-floatlabel variant="on">
                            <p-select [(ngModel)]="row.status" [options]="listStatus" optionLabel="label" [fluid]="true"
                                optionValue="value" [showClear]="true" [appendTo]="'body'"
                                id="status" name="status-{{i}}">
                            </p-select>
                            <label for="status">Trạng thái</label>
                        </p-floatlabel>
                    </td>
                    <td>
                        <p-floatlabel variant="on">
                            <p-select [(ngModel)]="row.status" [options]="listStatus" optionLabel="label" [fluid]="true"
                                optionValue="value" [showClear]="true" [appendTo]="'body'"
                                id="status" name="status-{{i}}">
                            </p-select>
                            <label for="status">Trạng thái</label>
                        </p-floatlabel>
                    </td>
                    <td><p-inputnumber [(ngModel)]="row.quantity" name="quantity-{{i}}" inputId="minmax" mode="decimal" [min]="0" [max]="100" /></td>
                    <td>
                        <input type="text" pInputText [(ngModel)]="row.description">
                    </td>
                    <td class="text-center">
                        <p-button icon="pi pi-trash" severity="danger" (onClick)="deleteRow(i)"></p-button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-4">
        <p-button label="Lưu" severity="success" (onClick)="submit()"></p-button>
        <p-button label="Đóng" (onClick)="close()"></p-button>
    </div>
</div>
