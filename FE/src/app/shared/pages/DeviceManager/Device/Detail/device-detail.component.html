<div>
  <h2>{{ isAddMode ? 'Thêm mới thiết bị' : (isViewMode ? 'Xem chi tiết thiết bị' : 'Sửa thiết bị') }}</h2>

  <form #f="ngForm" *ngIf="model">
    <div class="row my-3">
      <div class="col-6" *ngIf="!isAddMode">
        <p-floatlabel variant="on">
          <input pInputText id="code" name="code" [(ngModel)]="model.code" autocomplete="off" [disabled]="true" [fluid]="true"/>
          <label for="code">Mã thiết bị</label>
        </p-floatlabel>
      </div>
      <div [ngClass]="isAddMode ? 'col-12' : 'col-6'">
        <p-floatlabel variant="on">
          <input pInputText id="name" name="name" [(ngModel)]="model.name" required [invalid]="!model.name" autocomplete="off" [disabled]="isViewMode" [fluid]="true"/>
          <label for="name">Tên thiết bị</label>
        </p-floatlabel>
      </div>
    </div>

    <div class="row my-3">
      <div class="col-12">
        <p-floatlabel variant="on">
          <p-select [(ngModel)]="model.group" [options]="listDeviceGroups" optionLabel="name" [fluid]="true" [disabled]="isViewMode"
            [showClear]="true" [appendTo]="'body'" id="group" name="group" required [invalid]="!model.group" dataKey="id">
          </p-select>
          <label for="group">Tên nhóm thiết bị</label>
        </p-floatlabel>
      </div>
    </div>

    <div class="row my-3">
      <div class="col-4">
        <p-floatlabel variant="on">
          <p-select [(ngModel)]="model.branch" [options]="listBranches" optionLabel="name" [fluid]="true" [disabled]="isViewMode"
            [showClear]="true" [appendTo]="'body'" id="branch" name="branch" dataKey="id" required [invalid]="!model.branch">
          </p-select>
          <label for="branch">Tên ngành sản xuất</label>
        </p-floatlabel>
      </div>

      <div class="col-4">
        <p-floatlabel variant="on">
          <p-select [(ngModel)]="model.line" [options]="listLines" optionLabel="name" [fluid]="true" [disabled]="isViewMode"
            [showClear]="true" [appendTo]="'body'" id="line" name="line" dataKey="id" required [invalid]="!model.line">
          </p-select>
          <label for="line">Tên dây truyền sản xuất</label>
        </p-floatlabel>
      </div>

      <div class="col-4">
        <p-floatlabel variant="on">
          <p-select [(ngModel)]="model.team" [options]="listTeams" optionLabel="name" [fluid]="true" [disabled]="isViewMode"
            [showClear]="true" [appendTo]="'body'" id="team" name="team" dataKey="id">
          </p-select>
          <label for="team">Tên tổ sản xuất</label>
        </p-floatlabel>
      </div>
    </div>

    <div class="row my-3">
      <div class="col-4">
        <p-floatlabel variant="on">
          <input pInputText id="serialNumber" name="serialNumber" [(ngModel)]="model.serialNumber" autocomplete="off" [disabled]="isViewMode" [fluid]="true" required [invalid]="!model.serialNumber"/>
          <label for="serialNumber">Số serial</label>
        </p-floatlabel>
      </div>

      <div class="col-4">
        <p-floatlabel variant="on">
          <input pInputText id="source" name="source" [(ngModel)]="model.source" autocomplete="off" [disabled]="isViewMode" [fluid]="true"/>
          <label for="source">Nguồn</label>
        </p-floatlabel>
      </div>

      <div class="col-4">
        <p-floatlabel variant="on">
          <input pInputText id="supplier" name="supplier" [(ngModel)]="model.supplier" autocomplete="off" [disabled]="isViewMode" [fluid]="true"/>
          <label for="supplier">Nhà cung cấp</label>
        </p-floatlabel>
      </div>
    </div>

    <div class="row my-3">
      <div class="col-4">
        <p-floatlabel variant="on">
          <p-multiselect [options]="listMaintenanceCycles" [(ngModel)]="model.maintenanceCycle" name="maintenanceCycle" optionLabel="name"
            [filter]="false" [maxSelectedLabels]="5" display="chip" class="w-100" [disabled]="isViewMode">
          </p-multiselect>
          <label for="maintenanceCycle">Chu kỳ bảo trì</label>
        </p-floatlabel>
      </div>

      <div class="col-4">
        <p-floatlabel variant="on">
          <p-datepicker [(ngModel)]="model.installationDate" appDateConvert [iconDisplay]="'input'" [showIcon]="true" name="installationDate"
            inputId="icondisplay" [dateFormat]="'dd-mm-yy'"  appendTo="body" [inputSize]="100" [disabled]="isViewMode"/>
          <label for="installationDate">Ngày lắp đặt</label>
        </p-floatlabel>
      </div>

      <div class="col-4">
        <p-floatlabel variant="on">
          <p-datepicker [(ngModel)]="model.dateManufacture" appDateConvert [iconDisplay]="'input'" [showIcon]="true" name="dateManufacture"
            inputId="icondisplay" [dateFormat]="'dd-mm-yy'"  appendTo="body" [inputSize]="100" [disabled]="isViewMode"/>
          <label for="dateManufacture">Ngày sản xuất</label>
        </p-floatlabel>
      </div>
    </div>

    <div class="row my-3">
      <div class="col-4">
        <p-floatlabel variant="on">
          <input pInputText id="unit" name="unit" [(ngModel)]="model.unit" required [invalid]="!model.name" autocomplete="off" [disabled]="isViewMode" [fluid]="true"/>
          <label for="unit">Đơn vị tính</label>
        </p-floatlabel>
      </div>

      <div class="col-4">
        <p-floatlabel variant="on">
          <p-inputnumber id="price" name="price" [(ngModel)]="model.price" autocomplete="off" [disabled]="isViewMode" [fluid]="true" mode="decimal"/>
          <label for="price">Giá tiền</label>
        </p-floatlabel>
      </div>

      <div class="col-4">
        <p-floatlabel variant="on">
          <p-select [(ngModel)]="model.userManager" [options]="listUsers" optionLabel="name" optionValue="username" [fluid]="true" [disabled]="isViewMode"
            [showClear]="true" [appendTo]="'body'" id="userManager" name="userManager" dataKey="username">
          </p-select>
          <label for="userManager">Người quản lý</label>
        </p-floatlabel>
      </div>
    </div>

    <div class="row my-3">
      <div class="col-10">
        <p-floatlabel variant="on">
          <input pInputText id="scadaQrCode" name="scadaQrCode" [(ngModel)]="model.scadaQrCode" autocomplete="off" [disabled]="isViewMode" [fluid]="true"/>
          <label for="scadaQrCode">Scada QR code</label>
        </p-floatlabel>
      </div>

      <div class="col-2 d-flex align-items-center justify-content-around">
        <p-checkbox inputId="isMappingScada" [disabled]="isViewMode" [(ngModel)]="model.isMappingScada" [binary]="true"
          name="isMappingScada"></p-checkbox>
        <label for="isMappingScada" class="ms-2">Mapping với SCADA</label>
      </div>
    </div>

    <div class="row my-3">
      <div class="col-6">
        <p-card>
          <ng-template #subtitle>Ảnh QR Code</ng-template>
          <p-fileupload name="demo[]" url="https://www.primefaces.org/cdn/api/upload.php"
            [multiple]="true" accept="image/*" maxFileSize="1000000" mode="advanced" [disabled]="isViewMode">
            <ng-template #empty>
              <div>Drag and drop files to here to upload.</div>
            </ng-template>
          </p-fileupload>
        </p-card>
      </div>
      <div class="col-6">
        <p-card>
          <ng-template #subtitle>Ảnh thiết bị</ng-template>
          <p-fileupload name="demo[]" url="https://www.primefaces.org/cdn/api/upload.php"
            [multiple]="true" accept="image/*" maxFileSize="1000000" mode="advanced" [disabled]="isViewMode">
            <ng-template #empty>
              <div>Drag and drop files to here to upload.</div>
            </ng-template>
          </p-fileupload>
        </p-card>
      </div>
    </div>

    <div class="d-flex justify-content-end align-items-center my-3">
      <p-button *ngIf="!isViewMode" label="Quản lý danh sách vật tư" icon="pi pi-plus" severity="success" class="mx-1" (click)="openMaterialDialog()"></p-button>
      <p-button *ngIf="!isViewMode" label="Quản lý thông số" icon="pi pi-plus" severity="success" class="mx-1" (click)="openParameterDialog(model)"></p-button>

    </div>

    <div class="row my-3">
      <div class="col-12">
        <textarea pTextarea class="form-control" rows="5" placeholder="Mô tả ..." id="description" name="description"
          [(ngModel)]="model.description" [disabled]="isViewMode"></textarea>
      </div>
    </div>

    <div class="row my-3">
      <div class="col-12">
        <p-floatlabel variant="on">
          <p-select [(ngModel)]="model.status" [options]="listStatus" optionLabel="label" [fluid]="true" [disabled]="isViewMode"
            optionValue="value" [showClear]="true" [appendTo]="'body'" id="status" name="status" required [invalid]="!model.status">
          </p-select>
          <label for="status">Trạng thái</label>
        </p-floatlabel>
      </div>
    </div>
    
    <div class="d-flex justify-content-end mt-3">
      <p-button label="Quay lại" severity="info" (click)="onBack()" icon="pi pi-arrow-left" class="me-2"></p-button>
      <p-button *ngIf="!isViewMode" label="Lưu" icon="pi pi-save" severity="success" [disabled]="!f.valid" class="w-full max-w-[17.35rem]" (click)="save()"
            styleClass="w-full mx-auto" />
    </div>
  </form>
</div>
