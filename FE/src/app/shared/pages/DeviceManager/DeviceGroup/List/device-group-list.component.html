<!-- device-group-list.component.html -->
<app-base-table 
  [apiService]="deviceGroupService"
  [columns]="columns"
  [title]="'Danh sách nhóm thiết bị'"
  [showAddButton]="true">
  <ng-template appColumnTemplate="createdAt" let-rowData>
    {{ rowData | date: 'dd/MM/yyyy' }}
  </ng-template>
  <ng-template appColumnTemplate="updatedAt" let-rowData>
    {{ rowData | date: 'dd/MM/yyyy' }}
  </ng-template>
</app-base-table>
