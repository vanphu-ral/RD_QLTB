<div class="p-1">
    <div class="d-flex justify-content-end mt-2 mb-4">
        <p-button label="Thêm mã serial" icon="pi pi-plus" (onClick)="addNewRow()"></p-button>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>mã serial</th>
                    <th style="min-width: 200px;">ngày nhập</th>
                    <th>xuất xứ</th>
                    <th>đơn vị</th>
                    <th>số lượng</th>
                    <th>giá</th>
                    <th>đơn vị tiền</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let row of listSerials; let i = index">
                    <td><input type="text" pInputText [(ngModel)]="row.serial" name="serial-{{i}}"></td>
                    <td><p-datepicker [(ngModel)]="row.importDate" [iconDisplay]="'input'" [showIcon]="true"
                            name="importDate-{{i}}" inputId="icondisplay" [dateFormat]="'yy-mm-dd'" [showTime]="true"
                            appendTo="body" />
                    </td>
                    <td><input type="text" pInputText [(ngModel)]="row.supplier" name="supplier-{{i}}"></td>
                    <td><input type="text" pInputText [(ngModel)]="row.unit" name="unit-{{i}}"></td>
                    <td><p-inputnumber id="quantity" name="quantity-{{i}}" [(ngModel)]="row.quantity" autocomplete="off" /></td>
                    <td><p-inputnumber id="price" name="price-{{i}}" [(ngModel)]="row.price" autocomplete="off"
                            [fluid]="true" mode="decimal" /></td>
                    <td>
                        <p-select [(ngModel)]="row.currency" [options]="listCurrency" optionLabel="label" [fluid]="true"
                            optionValue="value" [showClear]="true" [appendTo]="'body'" id="currency-{{i}}"
                            name="currency-{{i}}">
                        </p-select>
                    </td>
                    <td>
                        <p-select [(ngModel)]="row.status" [options]="listStatus" optionLabel="label" [fluid]="true"
                            optionValue="value" [showClear]="true" [appendTo]="'body'" id="status-{{i}}"
                            name="status-{{i}}">
                        </p-select>
                    </td>
                    <td class="text-center">
                        <p-button icon="pi pi-trash" severity="danger" (onClick)="deleteRow(i)"></p-button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-4">
        <p-button label="Lưu" severity="success" (onClick)="submit()"></p-button>
        <p-button label="Đóng" (onClick)="close()"></p-button>
    </div>
</div>
