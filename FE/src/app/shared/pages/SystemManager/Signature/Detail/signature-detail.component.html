<div>
  <h2>{{ isAddMode ? 'Thêm mới nhóm tiêu chí' : (isViewMode ? 'Xem chi tiết nhóm tiêu chí' : 'Sửa nhóm tiêu chí') }}
  </h2>

  <form #f="ngForm" *ngIf="model">
    <div class="row my-3">
      <div class="col-23">
        <p-floatlabel variant="on">
          <p-select [(ngModel)]="model.username" [options]="listUsers" optionLabel="name" optionValue="username"
            [fluid]="true" [disabled]="isViewMode" [showClear]="true" [filter]="true" [required]="true" required [appendTo]="'body'" id="username"
            name="username" dataKey="username">
          </p-select>
          <label for="username">Người quản lý</label>
        </p-floatlabel>
      </div>
    </div>

    <div class="row my-3">
      <div class="col-12">
        <p-card>
          <ng-template #subtitle>Ảnh chữ ký</ng-template>
          <div *ngIf="model?.imageLink" class="mb-2">
            <img [src]="model.imageLink" alt="Ảnh chữ ký" style="max-width: 300px; max-height: 150px; border: 1px solid #ccc;" />
          </div>
          <p-fileupload name="signature" [customUpload]="true" (onSelect)="onFileSelect($event)" accept="image/*"
            maxFileSize="1000000" [disabled]="isViewMode">
            <ng-template #empty>
              <div>Chọn hoặc kéo ảnh chữ ký vào đây</div>
            </ng-template>
          </p-fileupload>
        </p-card>
      </div>
    </div>


    <div class="d-flex justify-content-end mt-3">
      <p-button label="Quay lại" severity="info" (click)="onBack()" icon="pi pi-arrow-left" class="me-2"></p-button>
      <p-button *ngIf="!isViewMode" label="Lưu" icon="pi pi-save" severity="success" [disabled]="!f.valid"
        class="w-full max-w-[17.35rem]" (click)="save()" styleClass="w-full mx-auto" />
    </div>
  </form>
</div>
