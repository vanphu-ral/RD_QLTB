<div class="p-1">

  <div class="row my-3">
    <div class="col-12">
      <p-floatlabel variant="on">
        <input pInputText id="name" name="name" [(ngModel)]="data.name" autocomplete="off" [fluid]="true" autofocus />
        <label for="name">Tên lỗi</label>
      </p-floatlabel>
    </div>
  </div>

  <div class="row my-3">
    <div class="col-12">
      <textarea pTextarea class="form-control" rows="5" placeholder="Mô tả ..." id="errorDescription" name="errorDescription"
          [(ngModel)]="data.errorDescription"></textarea>
    </div>
  </div>

  <div class="row my-3">
    <div class="col-6">
      <p-floatlabel variant="on">
        <p-datepicker [(ngModel)]="data.timeReported" appDateConvert [withTime]="true" [iconDisplay]="'input'" [showIcon]="true"
          name="timeReported" [dateFormat]="'dd-mm-yy'" appendTo="body" [inputSize]="100" [showTime]="true" hourFormat="24"/>
        <label for="timeReported">Ngày gặp sự cố</label>
      </p-floatlabel>
    </div>

    <div class="col-6">
      <p-floatlabel variant="on">
        <p-select [(ngModel)]="data.severity" [options]="listSeverity" optionLabel="label" [fluid]="true"
          optionValue="value" [showClear]="true" [appendTo]="'body'" id="severity" name="severity" required>
        </p-select>
        <label for="severity">Loại sự cố</label>
      </p-floatlabel>
    </div>
  </div>

  
  <div class="table-responsive">
    <p-table [value]="listError" responsiveLayout="scroll">
      <ng-template #caption>
        <div class="flex items-center justify-between">
          <span class="text-xl font-bold">Danh sách lỗi</span>
        </div>
      </ng-template>
      <ng-template pTemplate="header">
        <tr>
          <th>STT</th>
          <th>Tên sự cố</th>
          <th>Thời gian gặp sự cố</th>
          <th>Loại sự cố</th>
          <th>Thao tác</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-row let-i="rowIndex">
        <tr>
          <td>{{ i + 1 }}</td>
          <td>{{ row.name }}</td>
          <td>{{ row.timeReported | date: 'dd/MM/yyyy' }}</td>
          <td>{{ sevirityStatus(row.severity) }}</td>
          <td class="text-center">
            <p-button icon="pi pi-pencil" severity="warn" (onClick)="editRow(i)" styleClass="mx-2">
            </p-button>
            <p-button icon="pi pi-trash" severity="danger" (onClick)="deleteRow(i)" styleClass="mx-2">
            </p-button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="99" class="text-center">Chưa có đợt kiểm tra nào</td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <div class="d-flex justify-content-end gap-2 mt-4">
    <p-button label="Lưu" severity="success" (onClick)="submit()"></p-button>
    <p-button label="Đóng" (onClick)="close()"></p-button>
  </div>
</div>
