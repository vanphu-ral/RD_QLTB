<div class="p-1">

    <div class="row">
        <div class="col">
            <p-floatlabel variant="on">
                <p-select [(ngModel)]="model.supply" [options]="listSupplys" optionLabel="name" [fluid]="true" (ngModelChange)="onChangeSupply($event)"
                    [showClear]="true" [appendTo]="'body'" id="supply" name="supply"
                    required>
                </p-select>
                <label for="supply">Chọn vật tư</label>
            </p-floatlabel>
        </div>

        <div class="col">
            <p-floatlabel variant="on">
                <p-select [(ngModel)]="model.serial" [options]="serialOptions" optionLabel="serial" [fluid]="true"
                    [showClear]="true" [appendTo]="'body'" id="serial" name="serial">
                </p-select>
                <label for="serial">Serial</label>
            </p-floatlabel>
        </div>

        <div class="col">
            <p-floatlabel variant="on">
                <p-datepicker [(ngModel)]="model.usageDate" appDateConvert [iconDisplay]="'input'" [showIcon]="true"
                    name="usageDate" inputId="usageDate" [dateFormat]="'dd-mm-yy'" appendTo="body">
                </p-datepicker>
                <label for="usageDate">Ngày sử dụng</label>
            </p-floatlabel>
        </div>

        <div class="col">
            <p-floatlabel variant="on">
                <p-inputnumber [(ngModel)]="model.quantityUsed" name="quantityUsed" mode="decimal" inputId="quantityUsed"
                    [useGrouping]="false" [min]="0" [max]="model.serial?.quantity">
                </p-inputnumber>
                <label for="quantityUsed">Số lượng sử dụng</label>
            </p-floatlabel>
        </div>

        <div class="col">
            <p-floatlabel variant="on">
                <input type="text" pInputText [(ngModel)]="model.description" />
                <label for="description">Mô tả</label>
            </p-floatlabel>
        </div>
    </div>
    

    <div class="d-flex justify-content-end gap-2 mt-4">
        <p-button label="Thay thế vật tư" icon="pi pi-save" (onClick)="submit()"></p-button>
        <p-button label="Đóng" (onClick)="close()"></p-button>
    </div>
</div>
