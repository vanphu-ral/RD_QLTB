<div class="p-1">

    <div class="row my-3">
        <div class="col-4">
            <p-floatlabel variant="on">
                <input pInputText id="deviceCode" name="deviceCode" [(ngModel)]="data.device.device.code"
                    autocomplete="off" [fluid]="true" [disabled]="true" />
                <label for="deviceCode">Mã thiết bị</label>
            </p-floatlabel>
        </div>

        <div class="col-4">
            <p-floatlabel variant="on">
                <input pInputText id="deviceName" name="deviceName" [(ngModel)]="data.device.device.name"
                    autocomplete="off" [fluid]="true" [disabled]="true" />
                <label for="deviceName">Tên thiết bị</label>
            </p-floatlabel>
        </div>

        <div class="col-4">
            <p-floatlabel variant="on">
                <input pInputText id="qrCode" name="qrCode" [(ngModel)]="data.device.qrCode" autocomplete="off"
                    [fluid]="true" [disabled]="true" />
                <label for="qrCode">qrCode</label>
            </p-floatlabel>
        </div>
    </div>

    <div class="row my-3">
        <div class="col-4">
            <p-floatlabel variant="on">
                <input pInputText id="sampleReportName" name="sampleReportName"
                    [(ngModel)]="data.device.sampleReport.name" autocomplete="off" [fluid]="true" [disabled]="true" />
                <label for="sampleReportName">Mẫu biên bản</label>
            </p-floatlabel>
        </div>

        <div class="col-4">
            <p-floatlabel variant="on">
                <p-datepicker [(ngModel)]="data.planResult.dateTest" appDateConvert [iconDisplay]="'input'"
                    [showIcon]="true" name="dateTest" inputId="icondisplay" [dateFormat]="'dd-mm-yy'" appendTo="body"
                    [inputSize]="100" [disabled]="true" />
                <label for="dateTest">Ngày đánh giá</label>
            </p-floatlabel>
        </div>

        <div class="col-4">
            <p-floatlabel variant="on">
                <input pInputText id="userTest" name="userTest" [(ngModel)]="data.planResult.userTest"
                    autocomplete="off" [fluid]="true" [disabled]="true" />
                <label for="userTest">Người đánh giá</label>
            </p-floatlabel>
        </div>
    </div>

    <div class="d-flex justify-content-end mt-2 mb-4">
        <p-button label="Khai báo vật tư thay thế" icon="pi pi-wrench" severity="info"
            (onClick)="declareSupplyReplacement()"></p-button>
        <p-button label="Khai báo sự cố" icon="pi pi-exclamation-circle" severity="danger" class="mx-2"
            (onClick)="declareIssue()"></p-button>
    </div>

    <div class="table-responsive">
        <p-table [value]="model.planResultDetail" responsiveLayout="scroll">
            <ng-template pTemplate="header">
                <tr>
                    <th>STT</th>
                    <th>Nhóm Tiêu chí</th>
                    <th>Tên Tiêu chí</th>
                    <th>Tần suất</th>
                    <th>Người thực hiện</th>
                    <th *ngIf="data.plan.planType.code == PLANTYPE.DAILYCHECK">Ca kiểm tra</th>
                    <th *ngIf="data.plan.planType.code == PLANTYPE.DAILYCHECK">Thời gian kiểm tra</th>
                    <th [ngStyle]="data.plan.planType.code == PLANTYPE.MAINTENANCE ? {} : {'min-width': '600px'}">Mô tả</th>
                    <th *ngIf="data.plan.planType.code == PLANTYPE.MAINTENANCE">Ghi chú</th>
                    <th *ngIf="data.plan.planType.code == PLANTYPE.MAINTENANCE">Bộ phận thực hiện</th>
                    <th>Kết quả đánh giá</th>
                    <th class="text-center">
                        <div class="d-flex flex-column align-items-center">
                            <span>Không kiểm tra</span>
                            <p-checkbox [(ngModel)]="isCheckAll" [binary]="true" (onChange)="onCheckAllChange($event)"
                                pTooltip="Chọn tất cả" tooltipPosition="top">
                            </p-checkbox>
                        </div>
                    </th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-row let-i="rowIndex">
                <tr>
                    <td>{{ i + 1 }}</td>
                    <td>{{ row.criticalGroup }}</td>
                    <td>{{ row.criticalName }}</td>
                    <td> {{ row.frequency }}</td>
                    <td> {{ row.performer }}</td>
                    <td *ngIf="data.plan.planType.code == PLANTYPE.DAILYCHECK">
                        <p-select [(ngModel)]="row.examinationTime" [options]="listExaminationTimes" [fluid]="true"
                            [showClear]="true" [appendTo]="'body'" id="examinationTime" name="examinationTime" [disabled]="row.status == 0">
                        </p-select>
                    </td>
                    <td *ngIf="data.plan.planType.code == PLANTYPE.DAILYCHECK">
                        <p-select [(ngModel)]="row.inspectionSession" [options]="listInspectionSessions" [fluid]="true"
                            [showClear]="true" [appendTo]="'body'" id="inspectionSession" name="inspectionSession" [disabled]="row.status == 0">
                        </p-select>
                    </td>
                    <td>
                        <input pInputText id="note" name="note" [(ngModel)]="row.note" autocomplete="off"
                            [fluid]="true" [disabled]="row.status == 0"/>
                    </td>
                    <td *ngIf="data.plan.planType.code == PLANTYPE.MAINTENANCE">
                        <input pInputText id="comment" name="comment" [(ngModel)]="row.comment" autocomplete="off"
                            [fluid]="true" [disabled]="row.status == 0"/>
                    </td>
                    <td *ngIf="data.plan.planType.code == PLANTYPE.MAINTENANCE">
                        <input pInputText id="committee" name="committee" [(ngModel)]="row.committee" autocomplete="off"
                            [fluid]="true" [disabled]="row.status == 0"/>
                    </td>
                    <td>
                        <p-select [(ngModel)]="row.result" [options]="listResult" [fluid]="true" [showClear]="true"
                            [appendTo]="'body'" id="result" name="result" [disabled]="row.status == 0">
                        </p-select>
                    </td>
                    <td class="text-center">
                        <p-checkbox [(ngModel)]="row.status" [binary]="true" [trueValue]="0" [falseValue]="1" inputId="status" (onChange)="onRowCheckChange(row)">
                        </p-checkbox>
                    </td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="99" class="text-center">Chưa có đợt kiểm tra nào</td>
                </tr>
            </ng-template>
        </p-table>

    </div>

    <div class="d-flex justify-content-end gap-2 mt-4">
        <p-button label="Lưu" severity="success" (onClick)="submit()"></p-button>
        <p-button label="Đóng" (onClick)="close()"></p-button>
    </div>
</div>
