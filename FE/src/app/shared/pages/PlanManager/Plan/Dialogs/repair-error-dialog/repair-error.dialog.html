<div class="p-1">
  <div class="row my-3 ms-2">
    <h6>Nội dung sự cố</h6>
    <div [innerHTML]="data.errorDescription"></div>
  </div>
  <div class="row my-3">
    <div class="col-12">
      <p-fieldset legend="Nội dung và kết quả xử lý" class="custom-fieldset">
        <p-editor [(ngModel)]="data.repairDescription" name="description" [style]="{ height: '150px' }" autofocus></p-editor>
      </p-fieldset>
    </div>
  </div>

  <div class="row my-3">
    <div class="col-12">
      <p-fieldset legend="Kết luận" class="custom-fieldset">
        <p-editor [(ngModel)]="data.result" name="result" [style]="{ height: '150px' }"></p-editor>
      </p-fieldset>
    </div>
  </div>

  <div class="row my-3">
    <div class="col-12">
      <p-floatlabel variant="on">
        <p-datepicker [(ngModel)]="data.timeRepaired" appDateConvert [iconDisplay]="'input'" [showIcon]="true"
          name="timeRepaired" [dateFormat]="'dd-mm-yy'" appendTo="body" [inputSize]="100" [autofocus]="false">
        </p-datepicker>
        <label for="timeRepaired">Ngày sửa chữa</label>
      </p-floatlabel>
    </div>
  </div>


  <div class="d-flex justify-content-end gap-2 mt-4">
    <p-button label="Lưu" severity="success" (onClick)="submit()"></p-button>
    <p-button label="Đóng" (onClick)="close()"></p-button>
  </div>
</div>
