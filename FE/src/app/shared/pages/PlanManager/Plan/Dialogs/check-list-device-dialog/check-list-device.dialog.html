<div class="p-1">
    <div class="d-flex justify-content-end mt-2 mb-4">
        <p-button label="Thêm ngày kiểm tra" icon="pi pi-plus" (onClick)="addNewRow()"></p-button>
    </div>

    <div class="table-responsive">
        <p-table [value]="checkList" responsiveLayout="scroll">
            <ng-template pTemplate="header">
                <tr>
                    <th>STT</th>
                    <th>Mã thiết bị</th>
                    <th>Tên thiết bị</th>
                    <th>Mã serial</th>
                    <th>Người thực hiện</th>
                    <th>Ngày kiểm tra</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-row let-i="rowIndex">
                <tr>
                    <td>{{ i + 1 }}</td>
                    <td>{{ data.deviceCode }}</td>
                    <td>{{ data.deviceName }}</td>
                    <td>{{ data.serial }}</td>
                    <td>{{ row.userTest }}</td>
                    <td>
                        <p-datepicker [(ngModel)]="row.dateTest" appDateConvert [iconDisplay]="'input'" [showIcon]="true"
                            name="dateTest" inputId="icondisplay" [dateFormat]="'dd-mm-yy'" appendTo="body" />
                    </td>
                    <td>{{ row.status }}</td>
                    <td class="text-center">
                        <p-button icon="pi pi-save" styleClass="m-1"
                            (onClick)="saveDeviceCheckDate(row)" [disabled]="!row.dateTest"></p-button>
                        <p-button icon="pi pi-check-circle" styleClass="m-1" severity="info"
                            (onClick)="checkDevice(row)" [disabled]="!row.id"></p-button>
                        <p-button icon="pi pi-trash" severity="danger"
                            (onClick)="deleteRow(i)">
                        </p-button>
                    </td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="99" class="text-center">Chưa có đợt kiểm tra nào</td>
                </tr>
            </ng-template>
        </p-table>

    </div>

    <div class="d-flex justify-content-end gap-2 mt-4">
        <p-button label="Đóng" (onClick)="close()"></p-button>
    </div>
</div>
