<div class="p-1">

    <div class="table-responsive">
        <p-table [value]="listHistory" responsiveLayout="scroll">
            <ng-template pTemplate="header">
                <tr>
                    <th>STT</th>
                    <th>Ca kiểm tra</th>
                    <th>Thời gian kiểm tra</th>
                    <th>Người thực hiện</th>
                    <th>Xem chi tiết</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-row let-i="rowIndex">
                <tr>
                    <td>{{ i + 1 }}</td>
                    <td>{{ row.inspection }}</td>
                    <td>{{ row.createdAt }}</td>
                    <td>{{ row.createdBy }}</td>
                    <td>
                        <p-button icon="pi pi-eye" styleClass="m-1" severity="info" title="Xem chi tiết"
                            (onClick)="viewDetail(row)"></p-button>
                    </td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="99" class="text-center">Chưa có đợt kiểm tra nào</td>
                </tr>
            </ng-template>
        </p-table>

    </div>

    <div class="d-flex justify-content-end gap-2 mt-4">
        <p-button label="Đóng" (onClick)="close()"></p-button>
    </div>
</div>
<p-confirmDialog></p-confirmDialog>
<p-toast></p-toast>
