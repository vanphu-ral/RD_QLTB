<div class="p-1">
    <div class="row my-3">
        <p-table #dt [value]="data.result!">
            <ng-template pTemplate="header">
                <tr>
                    <th colspan="2">
                        <img src="/assets/imgs/logo-rang-dong.png" style="width:150px;" />
                    </th>
                    <th colspan="3" class="text-center">
                        <div>
                            <div><strong>KẾT QUẢ THỰC HIỆN MỤC TIÊU QUẢN LÝ THIẾT BỊ</strong></div>
                            <div><span id="SpanPlanYear">{{ data.executionTime | date:'MM/yyyy' }}</span></div>
                        </div>
                    </th>
                    <th colspan="2">
                        <label class="font-semibold">Đơn vị:&nbsp; Đơn vị: LED; Xưởng LED - Điện tử & TBCS</label>
                    </th>
                </tr>
                <tr>
                    <th style="width: 200px !important;">Nội dung</th>
                    <th>Mục tiêu</th>
                    <th>Kết quả thực hiện</th>
                    <th>Đánh giá</th>
                    <th>Kế hoạch tiếp theo</th>
                    <th>Ghi chú</th>
                    <th>Thao tác</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-row let-i="rowIndex">
                <tr>
                    <td>{{ row.measurement }}</td>
                    <td>{{ row.target }}</td>
                    <td>
                        <textarea rows="5" cols="30" fluid pTextarea class="form-control" placeholder="Enter ..." id="result"
                            name="result-{{ i }}" [(ngModel)]="row.result"></textarea>
                    </td>
                    <td>
                        <p-select [(ngModel)]="row.evaluate"  [options]="listEvaluate"
                            [fluid]="true"[showClear]="true" [appendTo]="'body'" id="evaluate"
                            name="evaluate-{{ i }}" optionLabel="name" optionValue="value" dataKey="id">
                        </p-select>
                    </td>
                    <td>
                        <textarea rows="5" cols="30" fluid pTextarea class="form-control" placeholder="Enter ..." id="nextTarget"
                            name="nextTarget-{{ i }}" [(ngModel)]="row.nextTarget"></textarea>
                    </td>
                    <td>
                        <textarea rows="5" cols="30" fluid pTextarea class="form-control" placeholder="Enter ..." id="note"
                            name="note-{{ i }}" [(ngModel)]="row.note"></textarea>
                    </td>
                    <td>
                        <p-button icon="pi pi-trash" severity="danger" (onClick)="deleteRow(i)" styleClass="mx-2"></p-button>
                    </td>
                </tr>
            </ng-template>

            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="99" class="text-center">Không có dữ liệu</td>
                </tr>
            </ng-template>
        </p-table>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-4">
        <p-button label="Lưu" (onClick)="submit()"></p-button>
        <p-button label="Đóng" (onClick)="close()"></p-button>
    </div>
</div>
<p-confirmDialog></p-confirmDialog>
<p-toast></p-toast>
