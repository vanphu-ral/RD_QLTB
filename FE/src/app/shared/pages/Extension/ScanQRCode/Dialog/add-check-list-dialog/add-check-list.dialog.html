<div class="p-1">
  <div class="row">
    <div class="col-12">
      <p-floatlabel variant="on">
        <p-datepicker
          [(ngModel)]="dateTest"
          appDateConvert
          [iconDisplay]="'input'"
          [showIcon]="true"
          name="dateTest"
          inputId="icondisplay"
          [dateFormat]="'dd-mm-yy'"
          appendTo="body"
          [inputSize]="100"
        />
        <label for="dateTest">Ngày kiểm tra</label>
      </p-floatlabel>
    </div>
  </div>

  <div class="d-flex justify-content-end gap-2 mt-4">
    <p-button label="Lưu" severity="success" (onClick)="submit()"></p-button>
    <p-button label="Đóng" (onClick)="close()"></p-button>
  </div>
</div>
<p-confirmDialog></p-confirmDialog>
<p-toast></p-toast>
