<div class="p-1">
    <div class="row my-3">
        <div class="col-12 col-md-4 mb-2">
            <p-floatlabel variant="on">
                <p-select [options]="listBranch" [(ngModel)]="selectedBranch" optionLabel="name" optionValue="id"
                    [showClear]="true" [filter]="true" filterBy="name" appendTo="body"
                    (onChange)="onBranchChange($event)" class="w-full" id="branch" [fluid]="true"></p-select>
                <label for="branch">Ngành</label>
            </p-floatlabel>
        </div>

        <div class="col-12 col-md-4 mb-2">
            <p-floatlabel variant="on">
                <p-select [options]="filteredTeams" [(ngModel)]="selectedTeam" optionLabel="name" optionValue="id"
                    [showClear]="true" [filter]="true" filterBy="name" appendTo="body"
                    (onChange)="onTeamChange($event)" class="w-full" id="team" [fluid]="true"></p-select>
                <label for="team">Tổ</label>
            </p-floatlabel>
        </div>

        <div class="col-12 col-md-4 mb-2">
            <p-floatlabel variant="on">
                <p-select [options]="filteredLines" [(ngModel)]="selectedLine" optionLabel="name" optionValue="id"
                    [showClear]="true" [filter]="true" filterBy="name" appendTo="body"
                    (onChange)="onLineChange($event)" class="w-full" id="line" [fluid]="true"></p-select>
                <label for="line">Dây chuyền</label>
            </p-floatlabel>
        </div>
    </div>

    <div class="table-responsive">
        <p-table [value]="listDevice" responsiveLayout="scroll" [paginator]="true" [rows]="10" selectionMode="single"
            [(selection)]="selectedDevice">
            <ng-template pTemplate="header">
                <tr>
                    <th>STT</th>
                    <th>Mã thiết bị</th>
                    <th>Tên thiết bị</th>
                    <th>Ngành</th>
                    <th>Tổ</th>
                    <th>Dây chuyền</th>
                    <th>Chọn</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-row let-i="rowIndex">
                <tr>
                    <td>{{ i + 1 }}</td>
                    <td>{{ row.code }}</td>
                    <td>{{ row.name }}</td>
                    <td>{{ row.branch?.name }}</td>
                    <td>{{ row.team?.name }}</td>
                    <td>{{ row.line?.name }}</td>
                    <td>
                        <p-button icon="pi pi-check" severity="success" [rounded]="true" [text]="true"
                            (onClick)="selectDevice(row)" title="Chọn thiết bị này"></p-button>
                    </td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="7" class="text-center">Không tìm thấy thiết bị nào</td>
                </tr>
            </ng-template>
        </p-table>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-3">
        <p-button label="Đóng" (onClick)="close()" severity="secondary"></p-button>
    </div>
</div>
