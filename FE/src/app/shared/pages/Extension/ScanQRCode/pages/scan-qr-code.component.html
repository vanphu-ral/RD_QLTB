<div class="qr-code-page mt-3">
  <div class="row">
    <div class="col-12 col-lg-3">
      <div class="device-info">
        <div class="scan-qr-device">
          <div class="d-flex my-4"  style="flex-direction: column;">
            <div class="d-flex justify-content-between">
              <label class="mb-2">
                <i class="fa-solid fa-qrcode" style="font-size: 2rem; margin-right: 10px;"></i>
                Quét mã thiết bị
              </label>
              <button *ngIf="scanType == 2" pButton type="button" label="Đổi Camera" icon="pi pi-refresh" (click)="toggleCamera()"></button>
            </div>
            <p-select [options]="optionScans" [(ngModel)]="scanType" optionLabel="label" optionValue="value" placeholder="Select a Scan Type" class="w-full md:w-56" />
            <video *ngIf="scanType == 2" #preview style="width: 100%; border: 1px solid #ccc; border-radius: 6px;"></video>
            <div class="mt-2">
              <strong>Mã serial:</strong> <input pInputText id="serial" name="serial" [(ngModel)]="serial" autocomplete="off" [fluid]="true" (keyup.enter)="getDeviceInfo(serial)"/>
            </div>
          </div>
          <div style="border: 1px solid;"></div>
          <div class="d-flex my-4">
            <p-floatlabel variant="on">
              <input pInputText id="code" name="code" autocomplete="off" fluid  [(ngModel)]="device.name" [disabled]="true" />
              <label for="code">Tên thiết bị</label>
            </p-floatlabel>
          </div>
          <div class="d-flex my-4">
            <p-floatlabel variant="on">
              <input pInputText id="code" name="code" autocomplete="off" fluid  [(ngModel)]="device.serialNumber" [disabled]="true" />
              <label for="code">Mã serial</label>
            </p-floatlabel>
          </div>
          <div class="d-flex my-4">
            <p-floatlabel variant="on">
              <input pInputText id="code" name="code" autocomplete="off" [fluid]="true" [(ngModel)]="device.displayLocation"  [disabled]="true"  />
              <label for="code">Vị trí lắp đặt</label>
            </p-floatlabel>
          </div>
          <div class="d-flex my-4">
            <p-floatlabel variant="on">
              <input pInputText id="code" name="code" autocomplete="off" [fluid]="true" [(ngModel)]="device.source" [disabled]="true" />
              <label for="code">Xuất xứ</label>
            </p-floatlabel>
          </div>
          <div class="d-flex my-4">
            <p-floatlabel variant="on">
              <input pInputText id="code" name="code" autocomplete="off" [fluid]="true" [(ngModel)]="device.supplier" [disabled]="true" />
              <label for="code">Nhà cung cấp</label>
            </p-floatlabel>
          </div>
          <div class="d-flex my-4">
            <p-floatlabel variant="on">
              <input pInputText id="code" name="code" autocomplete="off" [fluid]="true" [(ngModel)]="device.maintenanceCycle" [disabled]="true" />
              <label for="code">Chu kỳ bảo dưỡng</label>
            </p-floatlabel>
          </div>
          <div class="d-flex my-4">
            <p-floatlabel variant="on">
              <input pInputText id="code" name="code" autocomplete="off" [fluid]="true" [(ngModel)]="device.DateUseAndInstall" [disabled]="true" />
              <label for="code">Năm sản xuất - Năm đưa vào sử dụng</label>
            </p-floatlabel>
          </div>
          <div class="d-flex my-4">
            <p-floatlabel variant="on">
              <textarea pTextarea class="form-control" rows="3" [disabled]="true" cols="45" [(ngModel)]="device.description" placeholder="Thông tin khác" id="WorkArising"
                name="WorkArising"></textarea>
            </p-floatlabel>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12 col-lg-9">
      <app-information-tab [model]="device"></app-information-tab>
    </div>
  </div>
</div>
