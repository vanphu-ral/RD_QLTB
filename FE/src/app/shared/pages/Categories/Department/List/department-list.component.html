<!-- department-list.component.html -->
<app-base-table 
  [apiService]="departmentService"
  [columns]="columns"
  [title]="'Danh sách phòng ban/đơn vị'"
  [showAddButton]="true">
  <ng-template appColumnTemplate="createdAt" let-rowData>
    {{ rowData | date: 'dd/MM/yyyy' }}
  </ng-template>
  <ng-template appColumnTemplate="updatedAt" let-rowData>
    {{ rowData | date: 'dd/MM/yyyy' }}
  </ng-template>
</app-base-table>
