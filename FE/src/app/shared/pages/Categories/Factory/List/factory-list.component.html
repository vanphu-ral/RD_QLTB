<!-- factory-list.component.html -->
<app-base-table [apiService]="factoryService" [columns]="columns" [title]="'Danh sách xưởng sản xuất'"
  [showAddButton]="true">
  <ng-template appColumnTemplate="createdAt" let-rowData>
    {{ rowData | date: 'dd/MM/yyyy' }}
  </ng-template>
  <ng-template appColumnTemplate="updatedAt" let-rowData>
    {{ rowData | date: 'dd/MM/yyyy' }}
  </ng-template>
</app-base-table>
